<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nossa página de contato. Tire suas dúvidas e nos envie suas sugestões.">

    <title>Gole & Sabor | Contato</title>

     <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f1eb;
            color: #333;
        }

        header {
            margin: 0;
            text-align: center;
            padding: 25px;
        }

        h1 {
            margin: 0;
            color: #d4af37;
            padding: 20px;
        }

        nav a { 
            text-decoration: none; 
            margin: 0 12px; 
            font-weight: bold;
        } 
        
        nav a:hover { 
            color: #d4af37;
        }
        
        main {
            width: 100%;
            max-width: 600px; 
            margin: 10px auto; 
            padding: 0 20px;
        }
        
        section { 
            background-color: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
        } 
        
        h2 { 
            color: #7a4b35;
        } 
        
        form {
            display: flex; 
            flex-direction: column; 
        }
        
        label { 
            margin-top: 15px; 
            margin-bottom: 5px; 
            font-weight: bold; 
            color: #5a3828;
        }

        input, select, textarea { 
            padding: 12px; 
            border: 1px solid #c9b99a; 
            border-radius: 6px; 
            font-family: Arial, sans-serif; 
            font-size: 15px; 
            box-sizing: border-box; 
        } 
        
        textarea { 
            min-height: 150px;
        } 
        
        button { 
            margin-top: 20px; 
            padding: 12px; 
            background-color: #3b2418; 
            color: white; 
            border: none;
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
        } 
        
        button:hover { 
            background-color: #7a4b35;
        }
        
        footer { 
            background-color: #7a4b35; 
            color: white; 
            text-align: center; 
            padding: 20px; 
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
        </nav>
        <hr>

        <h1>Entre em Contato</h1>
    </header>

    <main>
        <section>
            <h2>Fale com a Gole &amp; Sabor</h2>
            <p>Preencha o formulário abaixo para enviar uma mensagem para nossa loja.</p>

            <form>
                <label for="nome">Nome:</label><br>
                <input type="text" name="nome" id="nome" placeholder="Seu nome" required><br><br>

                <label for="email">E-mail:</label><br>
                <input type="email" name="email" id="email" placeholder="exemplo@exemplo.com" required><br><br>

                <label for="assunto">Assunto:</label><br>
                <input type="text" name="assunto" id="assunto" placeholder="Assunto da mensagem" required><br><br>

                <label for="categoria">Categoria:</label><br>
                <select name="categoria" id="categoria" required>
                    <option value="">Selecione uma opção</option>
                    <option value="duvida">Dúvida</option>
                    <option value="sugestao">Sugestão</option>
                    <option value="elogio">Elogio</option>
                    <option value="reclamacao">Reclamação</option>
                </select><br><br>

                <label for="comentário">Comentário:</label><br>
                <textarea name="comentário" id="comentário" placeholder="Digite seu comentário aqui..." required></textarea><br><br>

                <button type="submit">Enviar mensagem</button>
            </form>
        </section>
    </main>
    <hr>

    <footer>
        <p>&copy; 2026 Gole &amp; Sabor. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
